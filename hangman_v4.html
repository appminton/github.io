<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman</title>
<style>
  *{box-sizing:border-box}
  body{font-family:sans-serif;background:#fafafa;color:#222;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem;margin:0;min-height:100vh}
  h1{font-size:22px;font-weight:700;margin-bottom:.1rem}
  /* Level bar */
  .level-bar{width:100%;max-width:420px;margin:.5rem 0}
  .level-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:3px}
  .progress-track{height:8px;background:#e5e5e5;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;border-radius:99px;transition:width .4s ease;background:#4a90e2}
  .progress-fill.tier-easy{background:#27ae60}
  .progress-fill.tier-medium{background:#f39c12}
  .progress-fill.tier-hard{background:#e74c3c}
  .tier-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin:.25rem 0}
  .tier-badge.tier-easy{background:#e8f8ee;color:#1a7a3e}
  .tier-badge.tier-medium{background:#fff8e1;color:#7a5a00}
  .tier-badge.tier-hard{background:#fde8e8;color:#c0392b}
  /* Gallows */
  .gallows svg{display:block;margin:0 auto}
  /* Word */
  .hint-box{font-size:13px;color:#777;text-align:center;margin:.25rem 0}
  .word-display{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:1rem 0}
  .word-letter{width:28px;text-align:center;font-size:22px;font-weight:700;border-bottom:2.5px solid #333;padding-bottom:2px;line-height:1.4}
  .status-msg{text-align:center;font-size:17px;font-weight:600;margin:.5rem 0;min-height:26px}
  /* Keyboard */
  #keyboard{display:flex;flex-wrap:wrap;justify-content:center;max-width:380px;margin:.25rem auto}
  .letter-btn{width:34px;height:34px;margin:2px;border:1px solid #ccc;background:#fff;color:#222;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .1s}
  .letter-btn:hover:not(:disabled){background:#f0f0f0}
  .letter-btn:disabled{opacity:.28;cursor:default}
  .letter-btn.wrong{background:#fde8e8;color:#c0392b;border-color:#e88}
  .letter-btn.right{background:#e8f8ee;color:#1a7a3e;border-color:#8d8}
  .letter-btn.flash{background:#ddeeff;border-color:#88b}
  /* Buttons */
  .action-row{display:flex;gap:10px;margin-top:.75rem;flex-wrap:wrap;justify-content:center}
  button.action{padding:8px 20px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:14px;cursor:pointer}
  button.action:hover{background:#f0f0f0}
  button.action.primary{background:#222;color:#fff;border-color:#222}
  button.action.primary:hover{background:#444}
  /* Score */
  .score-row{font-size:13px;color:#666;margin:.25rem 0}
  .kbd-hint{font-size:11px;color:#bbb;text-align:center;margin:.4rem 0 0}
  /* Completion overlay */
  #completion{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center}
  #completion.show{display:flex}
  .completion-card{background:#fff;border-radius:16px;padding:2.5rem 2rem;text-align:center;max-width:340px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.18)}
  .completion-card h2{font-size:28px;margin:0 0 .5rem}
  .completion-card p{color:#666;font-size:15px;margin:.5rem 0}
  .completion-card .stars{font-size:36px;letter-spacing:4px;margin:.5rem 0}
  .completion-card .tier-label{font-size:13px;font-weight:600;margin-bottom:1rem}
  .completion-card button{margin-top:1rem;padding:10px 28px;background:#222;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:100%}
  .completion-card button:hover{background:#444}
  /* Difficulty select screen */
  #diff-screen{position:fixed;inset:0;background:#fafafa;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
  #diff-screen h2{font-size:24px;font-weight:700;margin-bottom:.5rem}
  #diff-screen p.sub{color:#888;font-size:14px;margin-bottom:2rem;text-align:center}
  .diff-card{width:100%;max-width:320px;border:2px solid #e5e5e5;border-radius:14px;padding:1.25rem 1.5rem;margin:.5rem 0;cursor:pointer;text-align:left;background:#fff;transition:all .15s}
  .diff-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .diff-card.easy:hover,.diff-card.easy.sel{border-color:#27ae60;background:#f0faf4}
  .diff-card.medium:hover,.diff-card.medium.sel{border-color:#f39c12;background:#fffbf0}
  .diff-card.hard:hover,.diff-card.hard.sel{border-color:#e74c3c;background:#fdf3f3}
  .diff-card h3{font-size:17px;font-weight:700;margin:0 0 .25rem;display:flex;align-items:center;gap:.5rem}
  .diff-card p{color:#888;font-size:13px;margin:0}
  .start-btn{margin-top:1.5rem;padding:12px 40px;background:#222;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;width:100%;max-width:320px}
  .start-btn:hover{background:#444}
  #diff-screen.hidden{display:none}
</style>
</head>
<body>
<h1>🎮 Hangman</h1>

<!-- Difficulty selection screen -->
<div id="diff-screen">
  <h2>🎮 Hangman</h2>
  <p class="sub">Choose your difficulty to start</p>
  <div class="diff-card easy" onclick="selectDiff('easy')">
    <h3>🟢 Easy</h3>
    <p>Short 3–4 letter common words</p>
  </div>
  <div class="diff-card medium" onclick="selectDiff('medium')">
    <h3>🟡 Medium</h3>
    <p>5–7 letter everyday words</p>
  </div>
  <div class="diff-card hard" onclick="selectDiff('hard')">
    <h3>🔴 Hard</h3>
    <p>Long and challenging vocabulary</p>
  </div>
  <button class="start-btn" onclick="startGame()">Start Game ▶</button>
</div>

<!-- Completion overlay -->
<div id="completion">
  <div class="completion-card">
    <div class="stars" id="c-stars">&#x2B50;&#x2B50;&#x2B50;</div>
    <h2 id="c-title">Stage Complete!</h2>
    <div class="tier-label" id="c-tier"></div>
    <p id="c-msg"></p>
    <p class="score-row" id="c-score"></p>
    <button onclick="nextStage()">Continue &#x2192;</button>
  </div>
</div>

<div class="level-bar">
  <div class="level-label">
    <span id="lbl-level">Level 1 / 50</span>
    <span id="lbl-tier" class="tier-badge tier-easy">&#x1F7E2; Easy</span>
  </div>
  <div class="progress-track"><div class="progress-fill tier-easy" id="progress-fill"></div></div>
</div>

<div class="score-row" id="score-row">&#x2705; 0 &nbsp;|&nbsp; &#x274C; 0 &nbsp;|&nbsp; Mistakes left: 6</div>

<div class="gallows">
  <svg width="150" height="150" viewBox="0 0 160 160">
    <line x1="20" y1="155" x2="140" y2="155" stroke="#ccc" stroke-width="2"/>
    <line x1="50" y1="155" x2="50" y2="10" stroke="#ccc" stroke-width="2"/>
    <line x1="50" y1="10" x2="100" y2="10" stroke="#ccc" stroke-width="2"/>
    <line x1="100" y1="10" x2="100" y2="30" stroke="#ccc" stroke-width="2"/>
    <circle id="p-head" cx="100" cy="42" r="12" stroke="#c0392b" stroke-width="2.5" fill="none" opacity="0"/>
    <line id="p-body" x1="100" y1="54" x2="100" y2="100" stroke="#c0392b" stroke-width="2.5" opacity="0"/>
    <line id="p-larm" x1="100" y1="65" x2="78" y2="85" stroke="#c0392b" stroke-width="2.5" opacity="0"/>
    <line id="p-rarm" x1="100" y1="65" x2="122" y2="85" stroke="#c0392b" stroke-width="2.5" opacity="0"/>
    <line id="p-lleg" x1="100" y1="100" x2="78" y2="125" stroke="#c0392b" stroke-width="2.5" opacity="0"/>
    <line id="p-rleg" x1="100" y1="100" x2="122" y2="125" stroke="#c0392b" stroke-width="2.5" opacity="0"/>
  </svg>
</div>

<div class="hint-box" id="hint-box"></div>
<div class="word-display" id="word-display"></div>
<div class="status-msg" id="status-msg"></div>
<div id="keyboard"></div>
<div class="kbd-hint">&#x2328;&#xFE0F; Type letters on your keyboard</div>
<div class="action-row">
  <button class="action" onclick="retryLevel()">↺ Retry</button>
  <button class="action" onclick="restartToMenu()">⇤ Menu</button>
</div>

const PARTS=["p-head","p-body","p-larm","p-rarm","p-lleg","p-rleg"];
const TIER_NAMES=["Easy","Medium","Hard"];
const TIER_COLORS=["tier-easy","tier-medium","tier-hard"];
const TIER_ICONS=["&#x1F7E2;","&#x1F7E1;","&#x1F534;"];
const STAGE_SIZE=50;

let LEVELS=[];
let currentLevel=0, wins=0, losses=0;
let word, hint, guessed, wrong, gameOver=false;

function tierOf(lvl){ return Math.floor(lvl/STAGE_SIZE); }
function levelInStage(lvl){ return lvl%STAGE_SIZE; }

function buildLevels(startTier){
  LEVELS=[];
  const tiers=["easy","medium","hard"];
  for(let t=startTier;t<tiers.length;t++){
    const pool=[...ALL_WORDS[tiers[t]]];
    // Shuffle
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    const picked=pool.slice(0,STAGE_SIZE);
    LEVELS.push(...picked);
  }
}

function updateUI(){
  const tier=tierOf(currentLevel);
  const pos=levelInStage(currentLevel);
  const tc=TIER_COLORS[tier]||"tier-hard";
  const tn=TIER_NAMES[tier]||"Hard";
  const ti=TIER_ICONS[tier]||"&#x1F534;";
  document.getElementById("lbl-level").textContent="Level "+(pos+1)+" / "+STAGE_SIZE;
  const badge=document.getElementById("lbl-tier");
  badge.innerHTML=ti+" "+tn;
  badge.className="tier-badge "+tc;
  const fill=document.getElementById("progress-fill");
  fill.style.width=((pos+1)/STAGE_SIZE*100)+"%";
  fill.className="progress-fill "+tc;
  const tierPool=ALL_WORDS[["easy","medium","hard"][tier]||"hard"];
  document.getElementById("score-row").innerHTML=
    "&#x2705; "+wins+" &nbsp;|&nbsp; &#x274C; "+losses+" &nbsp;|&nbsp; Mistakes left: "+(PARTS.length-wrong)+" &nbsp;|&nbsp; Pool: "+tierPool.length+" words";
}

function startLevel(){
  const entry=LEVELS[currentLevel]||LEVELS[LEVELS.length-1];
  word=entry.w; hint=entry.h;
  guessed=new Set(); wrong=0; gameOver=false;
  document.getElementById("status-msg").textContent="";
  document.getElementById("hint-box").textContent="Hint: "+hint;
  PARTS.forEach(id=>document.getElementById(id).style.opacity="0");
  renderKeyboard(); renderWord(); updateUI();
}

function renderKeyboard(){
  const kb=document.getElementById("keyboard"); kb.innerHTML="";
  ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].forEach(row=>{
    const rowDiv=document.createElement("div");
    rowDiv.style.cssText="display:flex;justify-content:center;width:100%";
    row.split("").forEach(l=>{
      const btn=document.createElement("button");
      btn.className="letter-btn"; btn.textContent=l; btn.id="btn-"+l;
      btn.onclick=()=>guess(l); rowDiv.appendChild(btn);
    }); kb.appendChild(rowDiv);
  });
}

function renderWord(){
  const wd=document.getElementById("word-display"); wd.innerHTML="";
  word.split("").forEach(c=>{
    const span=document.createElement("span");
    span.className="word-letter";
    span.textContent=guessed.has(c)?c:"\u00A0";
    wd.appendChild(span);
  });
}

function guess(l){
  if(gameOver||guessed.has(l))return;
  guessed.add(l);
  const btn=document.getElementById("btn-"+l);
  if(btn){ btn.disabled=true; btn.classList.add(word.includes(l)?"right":"wrong"); }
  if(word.includes(l)){
    renderWord();
    if(word.split("").every(c=>guessed.has(c))){
      wins++; gameOver=true;
      updateUI();
      const nextLvl=currentLevel+1;
      if(nextLvl%STAGE_SIZE===0||nextLvl>=LEVELS.length){
        setTimeout(()=>showCompletion(currentLevel),600);
      } else {
        document.getElementById("status-msg").textContent="&#x1F389; Correct!";
        setTimeout(()=>{ currentLevel=nextLvl; startLevel(); },1000);
      }
    }
  } else {
    document.getElementById(PARTS[wrong]).style.opacity="1";
    wrong++;
    updateUI();
    if(wrong>=PARTS.length){
      losses++; gameOver=true;
      document.getElementById("status-msg").textContent="The word was: "+word;
      word.split("").forEach(c=>guessed.add(c));
      renderWord();
      document.querySelectorAll(".letter-btn:not(:disabled)").forEach(b=>b.disabled=true);
      updateUI();
    }
  }
}

function showCompletion(lvl){
  const tier=tierOf(lvl);
  const tn=TIER_NAMES[tier]||"Hard";
  const isLast=(lvl+1>=LEVELS.length);
  document.getElementById("c-stars").innerHTML="&#x2B50;&#x2B50;&#x2B50;";
  document.getElementById("c-title").textContent=isLast?"&#x1F3C6; All Stages Complete!":"Stage Complete!";
  const badge=document.getElementById("c-tier");
  badge.textContent=tn+" Stage Clear";
  badge.className="tier-label tier-badge "+TIER_COLORS[tier];
  document.getElementById("c-msg").textContent=isLast
    ? "Amazing! You finished all stages!"
    : "You cleared all 50 "+tn+" levels! Ready for the next challenge?";
  document.getElementById("c-score").innerHTML="&#x2705; "+wins+" wins &nbsp; &#x274C; "+losses+" losses";
  const btn=document.querySelector(".completion-card button");
  if(isLast){ btn.textContent="Play Again"; btn.onclick=restartToMenu; }
  else { btn.textContent="Next Stage \u2192"; btn.onclick=nextStage; }
  document.getElementById("completion").classList.add("show");
}

function nextStage(){
  currentLevel=Math.ceil((currentLevel+1)/STAGE_SIZE)*STAGE_SIZE;
  if(currentLevel>=LEVELS.length)currentLevel=0;
  document.getElementById("completion").classList.remove("show");
  startLevel();
}

function retryLevel(){
  if(!gameOver&&wrong===0)return;
  guessed=new Set(); wrong=0; gameOver=false;
  document.getElementById("status-msg").textContent="";
  PARTS.forEach(id=>document.getElementById(id).style.opacity="0");
  renderKeyboard(); renderWord(); updateUI();
}

function restartGame(){
  currentLevel=0; wins=0; losses=0;
  document.getElementById("completion").classList.remove("show");
  restartToMenu();
}

let selectedDiff=null;

function selectDiff(d){
  selectedDiff=d;
  document.querySelectorAll(".diff-card").forEach(c=>c.classList.remove("sel"));
  document.querySelector(".diff-card."+d).classList.add("sel");
}

function startGame(){
  if(!selectedDiff){ selectDiff("easy"); }
  const tierIdx=["easy","medium","hard"].indexOf(selectedDiff);
  currentLevel=0; wins=0; losses=0;
  buildLevels(tierIdx);
  document.getElementById("diff-screen").classList.add("hidden");
  startLevel();
}

function restartToMenu(){
  selectedDiff=null;
  document.querySelectorAll(".diff-card").forEach(c=>c.classList.remove("sel"));
  document.getElementById("completion").classList.remove("show");
  document.getElementById("diff-screen").classList.remove("hidden");
}

document.addEventListener("keydown",e=>{
  const l=e.key.toUpperCase();
  if(/^[A-Z]$/.test(l)&&!gameOver){
    const btn=document.getElementById("btn-"+l);
    if(btn&&!btn.disabled){
      btn.classList.add("flash");
      setTimeout(()=>btn.classList.remove("flash"),150);
      guess(l);
    }
  }
});
</script>
